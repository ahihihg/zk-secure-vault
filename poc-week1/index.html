<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>ZK-Vault PoC Week 1 - Text Secret</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 16px;
        }

        textarea,
        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
            background: #0066cc;
            color: #fff;
            border: none;
            border-radius: 4px;
        }

        .card {
            border: 1px solid #ddd;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
    <h2>Zero-Knowledge Text Secret PoC</h2>

    <div class="card">
        <h3>1. Tạo Secret</h3>
        <textarea id="secretInput" rows="3" placeholder="Nhập API key, mật khẩu hoặc ghi chú bí mật..."></textarea>
        <button onclick="encryptText()">Mã hóa & Tạo Link (#key)</button>
        <input type="text" id="shareLink" readonly placeholder="Link chia sẻ sẽ hiện ở đây..." />
    </div>

    <div class="card">
        <h3>2. Giải mã từ URL Hash</h3>
        <button onclick="decryptText()">Giải mã ngay</button>
        <p><strong>Nội dung gốc:</strong> <span id="decryptedOutput" style="color: green; font-weight: bold;"></span>
        </p>
    </div>

    <script>
        let serverCiphertextMock = null; // Giả lập bản mã lưu trên server

        const toBase64Url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

        const fromBase64Url = (str) => {
            let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4) b64 += '=';
            return Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
        };

        async function encryptText() {
            const text = document.getElementById('secretInput').value;
            if (!text) return alert('Hãy nhập chuỗi cần mã hóa!');

            const encoded = new TextEncoder().encode(text);
            const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);

            // Gộp [12B IV + Ciphertext]
            const combined = new Uint8Array(iv.length + ciphertext.byteLength);
            combined.set(iv, 0);
            combined.set(new Uint8Array(ciphertext), iv.length);
            serverCiphertextMock = combined.buffer;

            const rawKey = await crypto.subtle.exportKey('raw', key);
            const keyHash = toBase64Url(rawKey);

            window.location.hash = keyHash;
            document.getElementById('shareLink').value = window.location.href;
        }

        async function decryptText() {
            if (!serverCiphertextMock) return alert('Chưa có bản mã!');
            const keyHash = window.location.hash.substring(1);
            if (!keyHash) return alert('Không tìm thấy key trên URL hash!');

            try {
                const key = await crypto.subtle.importKey('raw', fromBase64Url(keyHash), { name: 'AES-GCM' }, false, ['decrypt']);
                const data = new Uint8Array(serverCiphertextMock);
                const iv = data.slice(0, 12);
                const ciphertext = data.slice(12);

                const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
                document.getElementById('decryptedOutput').textContent = new TextDecoder().decode(decrypted);
            } catch (e) {
                alert('Giải mã thất bại! Key trên URL đã bị sai.');
            }
        }
    </script>
</body>

</html>
